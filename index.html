<html>

<head>
    <title>PahalOS</title>
    <style>
        @font-face {
            font-family: Pixelbasel;
            src: url(fonts/Pixelbasel.ttf);
        }

        body {
            background-color: #090a0f;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Pixelbasel;
            color: greenyellow;
        }

        .PahalOS {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Pixelbasel;
            color: greenyellow;
            font-size: 50px;
        }

        .command {
            font-family: Pixelbasel;
            color: greenyellow;
            font-size: 20px;
            background: transparent;
            border: none;
            outline: none;
            width: 92%;
        }
    </style>
</head>

<body>
    <div class="PahalOS">
        <h1>PahalOS</h1>
    </div>
    <div style="white-space: nowrap;">
        user@pahalos:~$<input type="text" autofocus class="command">

</html>
